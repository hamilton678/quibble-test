  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #243447;
      text-align: center;
      padding: 60px 20px;
    }

    .card {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
    }

    .button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Welcome to Quibble</h1>

    <p>Something strange has happened.</p>
