<!DOCTYPE html>
<html>
<head>
  <title>The Quibble Gate</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #243447;
      text-align: center;
      padding: 40px 20px;
    }

    .card {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .captcha {
      margin-top: 30px;
      width: 400px;
      height: 540px;
      border: 1px solid #ccc;
    }

    #success {
  display: none;
  margin-top: 25px;
  padding: 15px;
  background: #e8f5e9;
  border-radius: 10px;
  font-weight: bold;
}
  </style>
</head>

<body>

  <div class="card">

    <h1>The Quibble Gate</h1>

    <p>
      Before you can enter Quibble, you have to prove you're human.
    </p>

    <iframe
      class="captcha"
      src="https://embed.neal.fun/not-a-robot/5"
      width="400"
      height="540"
      frameborder="0">
    </iframe>

    <div id="success">
  🎉 CAPTCHA complete! The gate is unlocked!
</div>

  </div>

<script>
  window.addEventListener("message", (event) => {
    if (event.data.type === "captcha-completed") {
      document.getElementById("success").style.display = "block";
    }
  });
</script>
  
</body>
</html>
